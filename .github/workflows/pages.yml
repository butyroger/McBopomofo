# Publishes the user guide (Source/UserGuide.html) to GitHub Pages.
name: Publish User Guide

on:
  push:
    branches: [smart-learning]
    paths:
      - Source/UserGuide.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the site
        run: |
          mkdir _site
          cp Source/UserGuide.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
